name: Clone Private Repo

on:
  push:
    branches:
      - main

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v3

      - name: Clone private repo
        run: |
          git clone https://kanchana08:${{ secrets.TESTING }}@github.com/kanchana08/github_actions.git
